title: Fuerza bruta SSH - Failed password en sshd
id: 4f1c9d20-7b31-4e58-9a62-1d0c3e5f7a84
status: experimental
description: |
  Detecta intentos de autenticación SSH fallidos registrados por sshd con el mensaje
  "Failed password". En el dataset sintético CIAC-011 aparecen 380 eventos, todos
  maliciosos (T1110.001), originados desde una sola IP externa.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://github.com/ciberciac/CIAC-LATAM-COMMUNITY-HUB/tree/main/datasets
author: CIAC LATAM Community (ejercicio Kaizen)
date: 2026-11-26
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    proceso: sshd
    mensaje|contains: 'Failed password'
  condition: selection
falsepositives:
  - Usuarios legítimos que equivocan la contraseña; verificar IP de origen y frecuencia por ventana
  - Pruebas de penetración autorizadas contra activos propios
level: high
