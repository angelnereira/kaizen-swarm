title: Persistencia mediante tarea programada apuntando a AppData
id: 6d3a1f28-94c5-4e07-b2a9-1f5c8d3e6b72
status: experimental
description: |
  Detecta la creación de tareas programadas (schtasks /create) cuyo comando apunta
  a un ejecutable ubicado en un directorio AppData del usuario (T1053.005). Patrón
  habitual de persistencia de troyanos de acceso remoto.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: CIAC LATAM Community (contribución Kaizen)
date: 2026-11-25
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_cli:
    CommandLine|contains|all:
      - '/create'
      - 'AppData'
  condition: all of selection_*
falsepositives:
  - Instaladores legítimos que crean tareas programadas desde directorios de usuario
  - Herramientas de actualización auto-desplegadas en el perfil del usuario
level: medium
