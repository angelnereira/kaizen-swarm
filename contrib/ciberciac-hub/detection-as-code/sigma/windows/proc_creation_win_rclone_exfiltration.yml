title: Exfiltración de datos con rclone a almacenamiento remoto
id: b4e90d27-5f3a-4c81-a6d2-8e1b7c4f9a05
status: experimental
description: |
  Detecta el uso de rclone.exe para copiar o sincronizar archivos hacia un remoto
  (T1567.002 / T1048). En el dataset sintético aparece copiando un archivo 7z
  cifrado a un proveedor de almacenamiento con un archivo de configuración propio.
references:
  - https://attack.mitre.org/techniques/T1567/002/
  - https://attack.mitre.org/techniques/T1048/
author: CIAC LATAM Community (contribución Kaizen)
date: 2026-11-25
tags:
  - attack.exfiltration
  - attack.t1567.002
  - attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\rclone.exe'
  selection_cli:
    CommandLine|contains:
      - ' copy '
      - ' sync '
  condition: selection_img and selection_cli
falsepositives:
  - Copias de respaldo legítimas gestionadas con rclone por el equipo de infraestructura
  - Procesos autorizados de sincronización con almacenamiento en la nube
level: high
